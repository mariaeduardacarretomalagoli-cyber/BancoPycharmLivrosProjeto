<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="static/css/novo.css">
</head>
<body>

    <h1>Cadastrar novo livro</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main>
        <form action="/criar" method="post" ENCTYPE="multipart/form-data">

            <label for="imagem">Capa livro: </label>
            <input type="file" id="imagem" name="imagem" accept=".jpg">

            <label for="nome">Nome do livro: </label>
            <input type="text" id="nome" name="nome" required>

            <label for="autor">Autor do livro: </label>
            <input type="text" id="autor" name="autor" required>

            <label for="ano_publicacao">Ano de publicação: </label>
            <input type="number" id="ano_publicacao" name="ano_publicacao" required>


                <button type="submit">Cadastrar</button>

        </form>
    </main>

</body>
</html>
